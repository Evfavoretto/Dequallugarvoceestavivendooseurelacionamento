<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>De qual Lugar Emocional você está se relacionando? | Método O Seu Lugar®</title>
<meta name="description" content="Aula especial do Método O Seu Lugar® para entender de qual Lugar Emocional você está se relacionando.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f7f2e9;--paper:#fffdf9;--green:#173f35;--gold:#c39b5b;--text:#27312e;--muted:#68736f;--line:rgba(23,63,53,.12)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffdf8,var(--cream));color:var(--text);font-family:"DM Sans",sans-serif;line-height:1.62}
.wrap{width:min(1060px,calc(100% - 34px));margin:auto}.hero{text-align:center;padding:42px 0 50px}
.brand{font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-size:.86rem;margin-bottom:25px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:7px 13px;color:var(--green);font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#ffffffa8}
h1,h2{font-family:"Playfair Display",serif;color:var(--green);line-height:1.08}h1{font-size:clamp(2.35rem,6vw,4.8rem);max-width:900px;margin:17px auto}
.sub{max-width:760px;margin:auto;font-size:clamp(1.03rem,2vw,1.2rem)}.note{max-width:720px;margin:14px auto 0;color:var(--muted)}
.video-shell{margin-top:32px;padding:9px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 55px #203b3117}
.video{position:relative;aspect-ratio:16/9;border-radius:17px;overflow:hidden;background:#0c1512}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
section{padding:64px 0}.card{background:#ffffffc9;border:1px solid var(--line);border-radius:25px;padding:clamp(26px,5vw,50px);text-align:center}
h2{font-size:clamp(2rem,4.5vw,3.35rem);max-width:850px;margin:12px auto 18px}.lead{max-width:760px;margin:auto;font-size:1.07rem}
.question{max-width:760px;margin:28px auto 0;padding:22px 25px;text-align:left;background:#fff9ef;border-left:4px solid var(--gold);border-radius:0 16px 16px 0}
.question small{color:var(--muted)}.question strong{display:block;color:var(--green);font:700 clamp(1.4rem,3vw,2rem)/1.25 "Playfair Display",serif;margin-top:5px}
.offer{background:var(--green);color:white;border-radius:28px;padding:clamp(30px,6vw,58px);box-shadow:0 20px 55px #203b3120}.offer h2{color:white}.offer p{color:#ffffffd1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.mini{border:1px solid #ffffff20;background:#ffffff0d;border-radius:17px;padding:20px}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#efd6a9;color:var(--green);font-weight:800;margin:0 auto 10px}
.mini strong{display:block}.mini p{font-size:.9rem;margin:6px 0 0}.pricebox{text-align:center;border-top:1px solid #ffffff25;padding-top:28px;margin-top:28px}
.old{text-decoration:line-through;color:#ffffff99}.price{font:700 clamp(3rem,7vw,5rem)/1 "Playfair Display",serif;color:#f2d9ac;margin:7px 0}.pay{color:#ffffffaa;margin-bottom:20px}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:58px;padding:16px 28px;background:#d4ae6e;color:var(--green);border-radius:14px;font-weight:800;text-transform:uppercase;box-shadow:0 10px 25px #0002}
.small{font-size:.88rem;color:#ffffffad!important;max-width:560px;margin:13px auto 0!important}
.proof{text-align:center}.prints{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px;align-items:start}
.print{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 10px 30px #203b310c}.print img{width:100%;height:auto;display:block}
.map{max-width:720px;margin:28px auto 0}.final{text-align:center;padding:55px 0 80px}.final p{max-width:700px;margin:0 auto 24px}.final .btn{margin-top:8px}
footer{text-align:center;border-top:1px solid var(--line);padding:28px;color:#78817e;font-size:.82rem}
@media(max-width:760px){.hero{padding-top:28px}section{padding:48px 0}.grid3,.prints{grid-template-columns:1fr}.btn{width:100%}.offer{border-radius:21px}.card{border-radius:20px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<div class="brand">Método O Seu Lugar®</div><h1>De qual Lugar Emocional você está se relacionando?</h1>

<main>
<section class="final" id="diagnostico-cta" style="display:none;">
  <div class="wrap">
    <a class="btn" href="https://pay.kiwify.com.br/OfAFlVE" target="_blank" rel="noopener">
      Fazer meu diagnóstico
    </a>
  </div>
</section>
</main>
<footer>Método O Seu Lugar® • Relacionamentos</footer>

<script>
  // O botão do diagnóstico aparece após 15 minutos e 35 segundos.
  const CTA_DELAY_MS = (15 * 60 + 35) * 1000;

  setTimeout(() => {
    const cta = document.getElementById('diagnostico-cta');
    if (cta) {
      cta.style.display = 'block';
    }
  }, CTA_DELAY_MS);
</script>

</body></html>
